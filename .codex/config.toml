# Codex: the studio's tools (ADR-0048). Codex reads this file only once the
# project is trusted; it asks the first time you start `codex` here.
# Start Codex from the repository root, as with Pi and Claude Code: the server
# resolves tsx and the library from the directory it starts in.

[mcp_servers.pva]
command = "node"
args = ["--import", "tsx", "studio/agent/mcp/server.ts"]
# Loading the extension takes a few seconds the first time.
startup_timeout_sec = 60
# A render can take many minutes. For one longer than this, run it with
# `npm run studio:tool` in the background (docs/running.md).
tool_timeout_sec = 1800

# Read-only tools run without asking, as in .claude/settings.json; anything
# that writes or spends asks first.

[mcp_servers.pva.tools.pva_version]
approval_mode = "approve"

[mcp_servers.pva.tools.pva_diagnostics]
approval_mode = "approve"

[mcp_servers.pva.tools.pva_config]
approval_mode = "approve"

[mcp_servers.pva.tools.pva_health]
approval_mode = "approve"

